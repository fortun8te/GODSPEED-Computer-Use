name: Publish to MCP Registry
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the published bundle
        run: |
          set -euo pipefail
          url=$(jq -er '.packages[0].identifier' server.json)
          hash=$(jq -er '.packages[0].fileSha256' server.json)
          curl -fsSL "$url" -o bundle.mcpb
          printf '%s  bundle.mcpb\n' "$hash" | sha256sum --check
      - name: Publish registry metadata
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.12/mcp-publisher_linux_amd64.tar.gz -o publisher.tar.gz
          tar -xzf publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
